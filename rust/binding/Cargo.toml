[package]
name = "gui-engine-binding"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
gossamer-binding = "0.75.0"
gui-engine = { path = "../gui-engine" }
# The program's build links windowing-gos's copy, which its own binding
# carries; `gos` patches it in. Standalone Cargo runs patch it the same way.
windowing = { package = "gos-windowing", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
