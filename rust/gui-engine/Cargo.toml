[package]
name = "gui-engine"
version = "0.2.9"
edition = "2024"
publish = false

[workspace]

# The optional parts an application may leave out of its build.
[features]
default = ["markup", "svg", "jpeg", "gif"]
# Markdown and HTML import into rich text.
markup = ["dep:pulldown-cmark", "dep:roxmltree"]
# SVG images and icons.
svg = ["dep:roxmltree"]
# JPEG and GIF images in the image viewer.
jpeg = ["dep:zune-jpeg", "dep:zune-core"]
gif = ["dep:gif"]

[dependencies]
pulldown-cmark = { version = "=0.13.6", optional = true }
ropey = "=1.6.1"
# The program's build links windowing-gos's copy, which its own binding
# carries; `gos` patches it in. Standalone Cargo runs patch it the same way.
windowing = { package = "gos-windowing", version = "0.1.0" }
parking_lot = "0.12"
# Content revisions of recorded paint are hashed every frame.
foldhash = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
jiff = "0.2"
png = "0.18"
zune-jpeg = { version = "=0.5.15", optional = true }
zune-core = { version = "=0.5.3", optional = true }
gif = { version = "=0.14.2", optional = true }
libloading = "0.9"
# Installed fonts are mapped rather than read when nothing the user runs can
# shorten the file (services/bounded_io.rs).
memmap2 = "0.9"
miniz_oxide = "0.9"
roxmltree = { version = "0.21", optional = true }
serde_json = "1"
thiserror = "2"
anyhow = "1"
scopeguard = "1"
unicase = "2"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
unicode-segmentation = "1"
# Fetches over HTTPS with Rustls and the Mozilla roots, as Gossamer's own
# HTTP client does.
ureq = { version = "3", default-features = false, features = ["rustls"] }
wezterm-term = { git = "https://github.com/gossamer-lang/wezterm-lite", tag = "v0.1.8", features = ["images"] }
portable-pty = "=0.9.0"
encoding_rs = "0.8"
regex = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_IO", "Win32_System_Threading"] }
