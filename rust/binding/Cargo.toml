[package]
name = "gui-engine-binding"
version = "0.2.16"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = ["markup", "svg", "jpeg", "gif"]
markup = ["gui-engine/markup"]
svg = ["gui-engine/svg"]
jpeg = ["gui-engine/jpeg"]
gif = ["gui-engine/gif"]

[dependencies]
gossamer-binding = "0.75.19"
gui-engine = { path = "../gui-engine", default-features = false }
# The program's build links windowing-gos's copy, which its own binding
# carries; `gos` patches it in. Standalone Cargo runs patch it the same way.
windowing = { package = "gos-windowing", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11-dl = "2.21"
